[package]
name = "sns-registrar"
version = "0.1.0"
authors = ["ellttBen <elliott@bonfida.com>"]
edition = "2024"
repository = "https://github.com/SolanaNameService/sns-registrar"
description = "This on-chain Solana program handles SNS domain registrations"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
no-entrypoint = []
test-bpf = []
no-referrer-check = []
no-special-discount-fee = []
devnet = []

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
solana-program = "4.0.0"
num-traits = "0.2.14"
num-derive = "0.3.3"
borsh = "1.7.0"
thiserror = "1.0.24"
spl-token = { version = "9.0.0", features = ["no-entrypoint"] }
bonfida-utils = "0.9.2"
spl-name-service = { package = "spl-name-service-2", version = "0.5.0", features = [
    "no-entrypoint",
] }
unicode-segmentation = "1.10.1"
phf = { version = "0.10", features = ["macros"] }
solana-security-txt = "1.1.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }


[dev-dependencies]
solana-program-test = { version = "4.1.2", features = ["agave-unstable-api"] }
tokio = { version = "1.0", features = ["macros"] }
futures = "0.3"
solana-sdk = "4.0.1"
spl-associated-token-account = { version = "8.0.0", features = [
    "no-entrypoint",
] }
random-string = "1.0.0"
bytemuck = "1.13.0"
serde = "1.0.198"
base64 = "0.22.0"
serde_json = "1.0.116"
bincode = "1.3.3"


[lib]
crate-type = ["cdylib", "lib"]
